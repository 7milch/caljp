version: 2

project_name: caljp

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]

checksum:
  name_template: checksums.txt

# The formula goes to the shared tap, pushed with a deploy key that can write only there.
brews:
  - repository:
      owner: 7milch
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:7milch/homebrew-tap.git
        private_key: "{{ .Env.TAP_DEPLOY_KEY }}"
    directory: Formula
    homepage: https://github.com/7milch/caljp
    description: BSD cal clone that colors Japanese holidays
    license: MIT
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: "caljp {{ .Tag }}"
    test: |
      assert_match version.to_s, shell_output("#{bin}/caljp --version")
